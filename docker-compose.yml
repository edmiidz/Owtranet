# Owtranet + MySQL in two containers.
#
#   cp .env.docker.example .env      # then fill in the four required values
#   docker compose up -d
#
# Open http://localhost:3006 and sign in with ADMIN_EMAIL / ADMIN_PASSWORD.
# Every optional feature in .env.example (AI agents, SMTP, …) can be added to
# the same .env; it is passed through to the app container.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-owtranet}
      MYSQL_USER: ${DB_USER:-owtranet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once MySQL's first-run init has finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    image: owtranet:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-owtranet}
      DB_USER: ${DB_USER:-owtranet}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      PORT: 3006
      BASE_URL: ${BASE_URL:-http://localhost:3006}
      CORS_ORIGIN: ${BASE_URL:-http://localhost:3006}
      # Plain-HTTP local installs must not force browsers onto https://.
      # Set to true once you serve Owtranet behind TLS.
      CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS:-false}
    ports:
      - "${OWTRANET_PORT:-3006}:3006"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
